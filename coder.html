<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pith - Coder Mode</title>
  <link rel="stylesheet"href="style.css"
</head>
<body>
  
  <div class="app-container">
    <a href="sidebar.js" class="nav-item active"></a>
    <div id="sidebar-container"></div>

  <!-- 2. MAIN CHAT AREA -->
  <main class="chat-container">
    <header class="chat-header">
      <h2>Pith <span class="sub-text">// Coder Assistant</span></h2>
    </header>

    <!-- MESSAGE FEED -->
    <div class="message-feed" id="messageFeed">
      <div class="message pith">
        <strong>Pith:</strong>
        <p>Ready to help. What are we working on today?</p>
      </div>
    </div>

    <!-- INPUT AREA AT THE BOTTOM -->
    <form class="input-container" id="chatForm" onsubmit="return false;">
      <textarea id="userInput" name="userInput" placeholder="Type your message."></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </main>
  </div>
    
  <script src="sidebar.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("chatForm") || document.querySelector(".input-container");
      const userInput = document.getElementById("userInput") || document.querySelector("textarea");
      const messageFeed = document.getElementById("messageFeed");

      if (!form || !userInput || !messageFeed) return;

      form.addEventListener("submit", (e) => {
        e.preventDefault(); 

        const text = userInput.value.trim();
        if (!text) return;

        const userMsg = document.createElement("div");
        userMsg.className = "message user";
        userMsg.innerHTML = `<strong>You:</strong> <p>${text}</p>;

        messageFeed.appendChild(userMsg);
        userInput.value = "";
        messageFeed.scrollTop = messageFeed.scrollHeight;
      });
    });
  </script>
</body>
</html>
